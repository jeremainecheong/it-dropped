apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper
  namespace: dropradar
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: dropradar
            component: scraper
        spec:
          containers:
          - name: scraper
            image: dropradar/scraper:latest
            envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "500m"
          restartPolicy: OnFailure
      backoffLimit: 2
