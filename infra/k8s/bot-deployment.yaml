apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-bot
  namespace: dropradar
  labels:
    app: dropradar
    component: bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dropradar
      component: bot
  template:
    metadata:
      labels:
        app: dropradar
        component: bot
    spec:
      containers:
      - name: bot
        image: dropradar/bot:latest
        ports:
        - containerPort: 8081
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
