apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: dropradar
  labels:
    app: dropradar
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dropradar
      component: api
  template:
    metadata:
      labels:
        app: dropradar
        component: api
    spec:
      containers:
      - name: api
        image: dropradar/api:latest
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
